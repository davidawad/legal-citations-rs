[package]
name = "legal-citations-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
legal-citations = { path = "../crates/legal-citations" }
serde_json = "1"

[[bin]]
name = "detect"
path = "fuzz_targets/detect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "detect_markdown"
path = "fuzz_targets/detect_markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_parse"
path = "fuzz_targets/policy_parse.rs"
test = false
doc = false
bench = false
