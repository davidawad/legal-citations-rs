[workspace]
resolver = "2"
members = ["crates/legal-citations", "crates/cite-detect", "crates/xtask-rules", "crates/cite-eval"]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
version = "0.1.0"
repository = "https://github.com/davidawad/legal-citations-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

# ~1,450 rules compile ~1,450 regexes per process; an unoptimized regex
# compiler makes every debug test binary and `cargo run` pay seconds for it.
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
