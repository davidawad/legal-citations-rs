[package]
name = "cite-eval"
description = "Measure legal-citations recall, precision and exact-span rate against hand-labeled gold citations."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "cite-eval"
path = "src/main.rs"

[dependencies]
legal-citations = { path = "../legal-citations" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
