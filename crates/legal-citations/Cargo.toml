[package]
name = "legal-citations"
description = "Detect legal citations (cases, statutes, regulations, rules, short forms, record cites) with exact spans, authority keys and markdown link status."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
url = "2"
schemars = "1"

[dev-dependencies]
proptest = "1"
